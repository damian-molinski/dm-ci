name: Deploy Prod

on:
  push:
    # Run on push to tags that match the pattern (e.g., 1.0.0, 2.1.3) no prefix or suffix allowed.
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gatekeeper:
    name: Validate Tag Format
    runs-on: ubuntu-latest
    outputs:
      is_pure_semver: ${{ steps.check.outputs.is_pure_semver }}
    steps:
      - name: Verify Strict SemVer
        id: check
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          if [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Match found: $TAG is a strict production release tag."
            echo "is_pure_semver=true" >> $GITHUB_OUTPUT
          else
            echo "Tag '$TAG' contains suffixes, letters, or pre-release qualifiers (e.g., -rc1). Skipping production deploy."
            echo "is_pure_semver=false" >> $GITHUB_OUTPUT
          fi

  version:
    name: Calculate Version
    needs: gatekeeper
    if: needs.gatekeeper.outputs.is_pure_semver == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Calculate semantic version
        id: semantic-version
        uses: PaulHatch/semantic-version@v6.0.2
        with:
          tag_prefix: ""
          major_pattern: "BREAKING CHANGE|!:"
          minor_pattern: "^feat"
          version_format: "${major}.${minor}.${patch}"

      - name: Debug version
        id: debug
        shell: bash
        env:
          BUILD_NAME: ${{ steps.semantic-version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          echo "Major: ${{ steps.semantic-version.outputs.major }}"
          echo "Minor: ${{ steps.semantic-version.outputs.minor }}"
          echo "Patch: ${{ steps.semantic-version.outputs.patch }}"
          echo "Increment: ${{ steps.semantic-version.outputs.increment }}"
          echo "Version type: ${{ steps.semantic-version.outputs.version_type }}"
          echo "Version: ${{ steps.semantic-version.outputs.version }}"
          echo "Version Tag: ${{ steps.semantic-version.outputs.version_tag }}"
          echo "Changed: ${{ steps.semantic-version.outputs.changed }}"
          echo "Is Tagged: ${{ steps.semantic-version.outputs.is_tagged }}"
          echo "GitHub Run Number: ${{ github.run_number }}"
  
      - name: Manual Calculate semantic version
        id: manual-semantic-version
        run: |
          git fetch --tags --prune --quiet
          BUILD_NUMBER='${{ github.run_number }}'
          
          # PRODUCTION: Use the raw tag directly (e.g., 1.0.0)
          VERSION_NAME="${{ github.ref_name }}"
          
          echo "computed_name=$VERSION_NAME"
          echo "computed_number=$BUILD_NUMBER"

  deploy:
    name: Deploy to Prod
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: Prod
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Deploy to Prod
        run: echo "Deploying to Prod environment..."

      - name: Build Changelog
        id: build_changelog
        uses: mikepenz/release-changelog-builder-action@v6.2.2
        with:
          configuration: .github/changelog-configuration.json
          mode: "COMMIT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          body: ${{ steps.build_changelog.outputs.changelog }}
