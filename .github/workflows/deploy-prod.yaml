name: Deploy Prod

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'
      - '!*-rc*'

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gatekeeper:
    name: Validate Tag Format
    runs-on: ubuntu-latest
    outputs:
      is_pure_semver: ${{ steps.check.outputs.is_pure_semver }}
    steps:
      - name: Verify Strict SemVer
        id: check
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          if [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Match found: $TAG is a strict production release tag."
            echo "is_pure_semver=true" >> $GITHUB_OUTPUT
          else
            echo "Tag '$TAG' contains suffixes, letters, or pre-release qualifiers (e.g., -rc1). Skipping production deploy."
            echo "is_pure_semver=false" >> $GITHUB_OUTPUT
          fi

  version-and-changelog:
    name: Calculate Version
    needs: gatekeeper
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build-name: ${{ github.ref_name }}
      build-number: ${{ github.run_number }}
      changelog: ${{ steps.build_changelog.outputs.changelog }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build Changelog
        id: build_changelog
        uses: mikepenz/release-changelog-builder-action@v6.2.2
        with:
          configuration: .github/changelog-configuration.json
          ignorePreReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Debug Outputs
        env:
          COMPUTED_BUILD_NAME: ${{ github.ref_name }}
          GENERATED_CHANGELOG: ${{ steps.build_changelog.outputs.changelog }}
        run: |
          echo "Computed Build Name: $COMPUTED_BUILD_NAME"
          echo "Computed Build Number: $GITHUB_RUN_NUMBER"
          echo "Generated Changelog:"
          echo "$GENERATED_CHANGELOG"

  deploy:
    name: Deploy to Prod
    needs: version-and-changelog
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: Prod
    steps:
      - name: Deploy to Prod
        run: echo "Deploying to Prod environment..."

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version-and-changelog.outputs.build-name }}
          name: Release ${{ needs.version-and-changelog.outputs.build-name }}
          body: ${{ needs.version-and-changelog.outputs.changelog }}
          target_commitish: ${{ github.sha }}
