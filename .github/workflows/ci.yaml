name: CI

on:
  pull_request:
    types:
      - ready_for_review
      - synchronize
      - reopened
      - opened
      - edited

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-pr-title:
    name: Validate PR Title
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Validate semantic PR title
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # The scope should be the RD ticket number, e.g. "RD-1234". This ensures that all PRs are linked to Jira.
          requireScope: true
          scopes: |
            RD-\d+