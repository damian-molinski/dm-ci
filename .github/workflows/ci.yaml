name: CI

on:
  pull_request:
    types:
      - ready_for_review
      - synchronize
      - reopened
      - opened
      - edited

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-pr-title:
    name: Validate PR Title
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Validate semantic PR title
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          requireScope: true
          scopes: |
            DM-CI-\d+

  test-changelog:
    name: Test Changelog
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Test Changelog
        run: echo "Testing changelog generation..."

      - name: Build Changelog
        id: github_release
        uses: mikepenz/release-changelog-builder-action@v6
        env:
          mode: "HYBRID"
          configuration: ".github/changelog-configuration.json"
          toTag: "0.3.9"
          fromTag: "0.2.2"

      - name: Debug Print Changelog
        run: |
          echo "Generated Changelog: ${{ steps.github_release.outputs.changelog }}"

